<table class="stats">
  <thead><tr><th>Statistic</th><th>Value</th><th>Counts</th></tr></thead>
  <tbody>
  {% for g in groups %}
    {% if g.label %}<tr class="group"><th colspan="3">{{ g.label }}</th></tr>{% endif %}
    {% for r in g.rows %}
    <tr>
      <th scope="row"><abbr class="def" title="{{ r.definition }}">{{ r.name }}</abbr></th>
      <td class="value">{{ r.value }}</td>
      <td class="muted">{{ r.counts }}</td>
    </tr>
    {% endfor %}
  {% endfor %}
  </tbody>
</table>
{% if not groups %}<p class="empty">No hands match these filters.</p>{% endif %}
