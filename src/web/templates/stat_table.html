<div class="card table-card">
  <div class="table-wrap">
    <table class="data stats">
      <thead><tr><th>Statistic</th><th class="num">Value</th><th class="num">Counts</th></tr></thead>
      <tbody>
      {% for g in groups %}
        {% if g.label %}<tr class="group"><th colspan="3"><span>{{ g.label }}</span></th></tr>{% endif %}
        {% for r in g.rows %}
        <tr>
          <th scope="row"><abbr class="def" title="{{ r.definition }}">{{ r.name }}</abbr></th>
          <td class="num value">{{ r.value }}</td>
          <td class="num muted">{{ r.counts }}</td>
        </tr>
        {% endfor %}
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% if not groups %}<p class="empty-note">No hands match these filters.</p>{% endif %}
